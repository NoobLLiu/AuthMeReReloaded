name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: Build AuthMeReReloaded
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 authid 插件相同的工具链：JDK 21（pom 要求 >=17）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 与本地成功构建一致的命令；跳过测试加快编译
      - name: Build with Maven
        run: mvn -B install -DskipTests -Dmaven.javadoc.skip=true

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: AuthMeReReloaded-${{ github.sha }}
          path: |
            target/*.jar
            !target/original-*.jar
          if-no-files-found: error
